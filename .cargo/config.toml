[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
ar = "x86_64-w64-mingw32-ar"

# unrar (C++) incluye cabeceras de Windows con mayúsculas que mingw-w64 trae en
# minúsculas; este directorio aporta los alias. Inofensivo en otras plataformas.
[env]
CPLUS_INCLUDE_PATH = { value = "tools/mingw-shim", relative = true }
