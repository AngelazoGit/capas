name: release

# Publica una Release de Windows portable al subir una etiqueta vX.Y.Z.
# También arranca a mano desde Actions -> Run workflow (indicando la versión).
# La auto-actualización de la app consulta releases/latest, así que cada release
# con make_latest hace que "Buscar actualizaciones" funcione.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versión (p. ej. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

env:
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  windows-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Sellar versión desde la etiqueta
        shell: bash
        # La etiqueta manda: escribe su número (sin la "v") en la PRIMERA línea
        # `version = "..."` de Cargo.toml (la del paquete) antes de compilar, para
        # que el binario embeba exactamente la versión de la release. Sin esto, la
        # app se actualiza a un .exe que reporta otra versión y vuelve a pedir
        # actualización en bucle.
        run: |
          set -e
          VER="${VERSION#v}"
          echo "Etiqueta=$VERSION  ->  version=$VER"
          awk -v ver="$VER" 'BEGIN{done=0} /^version = "/ && !done {sub(/"[^"]*"/, "\"" ver "\""); done=1} {print}' Cargo.toml > Cargo.toml.tmp
          mv Cargo.toml.tmp Cargo.toml
          grep -m1 '^version = ' Cargo.toml
          # Falla el build si el número de la etiqueta no es SemVer X.Y.Z.
          echo "$VER" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::etiqueta no SemVer: $VERSION"; exit 1; }
      - name: Test
        run: cargo test --release
      - name: Build
        run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          $stage = "capas-$env:VERSION-windows-x64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target/release/capas.exe $stage/
          Copy-Item LEEME.txt $stage/
          Copy-Item LICENSE   $stage/LICENSE.txt
          Copy-Item MCP.md    $stage/ -ErrorAction SilentlyContinue
          $zip = "$stage.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $zip -Force
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash
          "ZIP=$zip"        | Out-File -FilePath $env:GITHUB_ENV -Append
          "SHA256=$sha"     | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: CAPAS ${{ env.VERSION }}
          make_latest: true
          # El .zip versionado + el .exe suelto con nombre ESTABLE, para que
          # https://github.com/AngelazoGit/capas/releases/latest/download/capas.exe
          # sea una descarga directa que siempre apunta a la última versión.
          files: |
            ${{ env.ZIP }}
            target/release/capas.exe
          body: |
            CAPAS ${{ env.VERSION }} — portable Windows build.

            - Doble clic en `capas.exe` (no instala nada). SmartScreen: "Más información" → "Ejecutar de todas formas".
            - 100% local, sin cuenta ni conexión. GUI + consola, inglés/español.

            SHA-256 (zip): `${{ env.SHA256 }}`
