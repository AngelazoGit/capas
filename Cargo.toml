[package]
name = "capas"
version = "0.1.3"
edition = "2024"
authors = ["@angelazo"]
description = "Desmonta y decompila archivos por capas usando los recursos del ordenador"
license = "MIT"

[features]
# Permite que --edicion / CAPAS_EDICION fuercen la edición (solo desarrollo).
# El binario de producción se compila SIN esta feature: la edición de pago solo
# se activa con una licencia firmada.
override-edicion = []

[dependencies]
anyhow = "1.0.104"
bzip2 = "0.6.1"
clap = { version = "4.6.7", features = ["derive"] }
ed25519-dalek = "3.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "x11", "wayland", "default_fonts", "clipboard"] }
flate2 = "1.1.11"
getrandom = "0.4.3"
goblin = "0.10.7"
iced-x86 = "1.22.0"
lz4_flex = "0.11.3"
lzma-rs = "0.3.0"
rayon = "1.12.0"
ruzstd = "0.7.3"
rfd = "0.18.0"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sysinfo = "0.40.3"
tar = "0.4.46"
ureq = "2"
sevenz-rust2 = { version = "0.27", default-features = false, features = ["aes256", "bzip2", "ppmd", "deflate", "lz4", "brotli", "util"] }
unrar = "0.5"
cab = "0.6"
cfb = "0.16"
chd = "0.4"
cafebabe = "0.9"
dex = "0.5"
yaxpeax-arch = "0.3"
yaxpeax-arm = "0.5"
yaxpeax-mips = "0.1"
yaxpeax-arch02 = { package = "yaxpeax-arch", version = "0.2" }
wasmprinter = "0.263"
zip = { version = "2", default-features = false, features = ["deflate", "bzip2", "aes-crypto"] }

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
