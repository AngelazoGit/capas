[package]
name = "capas"
version = "0.1.0"
edition = "2024"
authors = ["@angelazo"]
description = "Desmonta y decompila archivos por capas usando los recursos del ordenador"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
bzip2 = "0.6.1"
clap = { version = "4.6.7", features = ["derive"] }
eframe = { version = "0.37.0", default-features = false, features = ["glow", "x11", "wayland", "default_fonts", "clipboard"] }
flate2 = "1.1.11"
goblin = "0.10.7"
iced-x86 = "1.22.0"
lzma-rs = "0.3.0"
rayon = "1.12.0"
rfd = "0.18.0"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sysinfo = "0.40.3"
tar = "0.4.46"
zip = { version = "2", default-features = false, features = ["deflate", "bzip2", "aes-crypto"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
